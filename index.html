<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report INOC 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mut:#6b7587;--line:#cfd6e2;--pri:#0b5cad;--ok:#1a8f4d;--bad:#c62f3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Noto Sans Thai',system-ui,sans-serif}
header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:18px;margin:0 12px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
button,select,input{font:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
header button{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}
header input,header select{padding:5px 8px;border-radius:6px;border:1px solid #fff6}
main{padding:clamp(8px,2vw,20px);width:100%;max-width:1800px;margin:auto}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tabs button{border-radius:6px 6px 0 0}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border-radius:8px;padding:clamp(8px,1.5vw,14px);box-shadow:0 1px 3px #0001;overflow:auto}
#det{overflow:visible}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:clamp(4px,.5vw,7px) clamp(6px,.8vw,10px);text-align:center;white-space:nowrap}
td.l{text-align:left}
thead th{background:#e7edf6;position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
#sum{max-height:calc(100vh - 150px)}
#sum table{min-width:720px}
#detTbl{overflow:auto;max-height:calc(100vh - 260px);-webkit-overflow-scrolling:touch}
#detTbl table{min-width:900px}
th.n,td.n{width:68px;min-width:68px;max-width:68px;padding-left:3px;padding-right:3px}
td.n input{min-width:0;padding:3px 2px}
td.x{padding:3px;vertical-align:top;text-align:left;white-space:normal}
td.x textarea{display:block;width:100%;min-width:200px;min-height:34px;resize:both;overflow:auto;font:inherit;line-height:1.35;padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:#fafbfd;white-space:pre-wrap;word-break:break-word}
td.x textarea:focus{border-color:var(--pri);background:#fff;outline:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
td.tm{max-width:clamp(180px,26vw,420px)}
button,select,input[type=date]{min-height:34px}
@media (min-width:1600px){body{font-size:15px}}
@media (max-width:900px){
  header{padding:10px 12px}
  header h1{font-size:16px;width:100%;margin:0}
  .bar{margin-left:0;width:100%}
  .bar button{flex:1 1 auto}
  #sum{max-height:none}
}
@media (max-width:640px){
  body{font-size:13px}
  .bar label,.bar select,.bar input{flex:1 1 140px}
  .tabs{overflow-x:auto}.tabs button{flex:1 0 auto}
  .filters>*{flex:1 1 150px}
  .ttl{flex-direction:column;gap:2px}
  #detTbl{max-height:calc(100vh - 340px)}
  dialog{width:96vw!important;padding:12px}
}
@media (pointer:coarse){button,select,input[type=date]{min-height:40px}td input{min-height:34px}}
@media print{header,.tabs,.filters,#st{display:none}#sum,#detTbl{max-height:none;overflow:visible}body{background:#fff}.card{box-shadow:none}}
.ttl{display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding:4px 2px 8px}
tr.tot td{background:#eef3fa;font-weight:700}
.good{color:var(--ok);font-weight:600}.warn{color:var(--bad);font-weight:600}
.filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filters input,.filters select{padding:5px 8px;border:1px solid var(--line);border-radius:6px}
td input{width:100%;min-width:44px;border:1px solid transparent;padding:3px 5px;background:#fafbfd;border-radius:4px;text-align:center}
td input.t{min-width:150px;text-align:left}
td input:focus{border-color:var(--pri);background:#fff;outline:0}
td.tm{text-align:left;overflow:hidden;text-overflow:ellipsis}
#st{font-size:12px;color:var(--mut);margin-top:10px}
dialog{border:0;border-radius:10px;padding:18px;max-width:94vw;box-shadow:0 8px 40px #0005}
dialog label{display:block;margin:8px 0 2px;font-weight:600}
dialog input.w{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px}
dialog td input{text-align:left;background:#fff;border-color:var(--line)}
.stp{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #eef0f4}
.stp b{min-width:22px}.stp small{display:block;color:var(--mut)}
.stp.ok b{color:var(--ok)}.stp.fail b,.stp.fail{color:var(--bad)}.stp.warn b{color:#b7791f}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<header>
  <h1>Report INOC 2026</h1>
  <div class="bar">
    <label>วันที่ <input type="date" id="date"></label>
    <label>Skill <select id="skill"><option value="">ทั้งหมด</option><option>OFC</option><option>NODE</option></select></label>
    <button id="bTeams">⬆ Upload รายชื่อทีม (Teams Online)</button>
    <button id="bWO">⬆ Upload งานที่ปิดได้ (WO)</button>
    <button id="bRoster">✎ Cluster Leader</button>
    <button id="bCfg">⚙ Supabase</button>
  </div>
</header>
<input type="file" id="fTeams" accept=".xlsx,.xls" hidden>
<input type="file" id="fWO" accept=".xlsx,.xls,.csv" hidden>
<main>
  <div class="tabs"><button data-t="sum" class="on">สรุปรายงาน</button><button data-t="det">รายละเอียด (Follow-up)</button></div>
  <section id="sum" class="card"></section>
  <section id="det" class="card" hidden>
    <div class="filters">
      <select id="fCL"></select>
      <select id="fProv"></select>
      <select id="fPlan"><option value="">Plan ทั้งหมด</option><option value="1">Plan = 1 (มีแผนทำงาน)</option><option value="0">Plan = 0 (ไม่มีแผน)</option></select>
      <select id="fJob"><option value="">งานที่ปิดได้ ทั้งหมด</option><option value="1">ปิดได้ (≥ 1 งาน)</option><option value="0">ไม่มีงานที่ปิดได้ (0 / ว่าง)</option></select>
      <input id="fQ" placeholder="ค้นหาชื่อทีม / ID">
      <select id="fAct"><option value="">Actual ทั้งหมด</option><option value="1">Actual = 1 (Clock in)</option><option value="0">Actual = 0 (ไม่ Clock in)</option><option value="gap">Plan &gt; Actual (ไม่มาตามแผน)</option></select>
    </div>
    <div id="detTbl"></div>
  </section>
  <div id="st"></div>
</main>

<dialog id="dR"><b>แก้ไขรายชื่อ Cluster Leader</b>
  <div style="overflow:auto;max-height:60vh;margin-top:8px"><table><thead><tr><th>AD EAS</th><th>Mgr.</th><th>Cluster Leader</th><th>Province</th><th></th></tr></thead><tbody id="rBody"></tbody></table></div>
  <div class="row"><button id="rAdd">+ เพิ่มแถว</button><button id="rCancel">ยกเลิก</button><button class="p" id="rSave">บันทึก</button></div>
</dialog>

<dialog id="dT" style="width:380px"><b>Upload รายชื่อทีม (Teams Online)</b>
  <label>ข้อมูลในไฟล์นี้เป็นของวันที่</label><input class="w" type="date" id="tDate">
  <div style="color:var(--mut);margin-top:8px;font-size:12px">Active ← Team Total · Plan ← Working Plan · Actual ← Clock in</div>
  <div class="row"><button id="tCancel">ยกเลิก</button><button class="p" id="tOk">นำเข้า</button></div>
</dialog>

<dialog id="dW" style="width:620px"><b>Pipeline นำเข้างานที่ปิดได้</b>
  <div id="wSteps" style="margin-top:10px"></div>
  <div class="row"><button class="p" id="wClose">ปิด</button></div>
</dialog>

<dialog id="dC" style="width:480px"><b>เชื่อมต่อ Supabase (Report INOC 2026)</b>
  <label>Project URL</label><input class="w" id="cUrl" placeholder="https://xxxx.supabase.co">
  <label>anon / publishable key</label><input class="w" id="cKey">
  <div class="row" style="justify-content:flex-start"><button id="cPush">ส่งข้อมูลปัจจุบันขึ้น Supabase</button><button id="cPull">ดึงข้อมูลจาก Supabase</button></div>
  <div class="row"><button id="cCancel">ปิด</button><button class="p" id="cSave">บันทึก</button></div>
</dialog>

async function sb(method,path,body,hdr={}){
  const r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/'+path,{method,headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json',...hdr},body:body?JSON.stringify(body):undefined});
  if(!r.ok) throw new Error(await r.text());

}
const remote=()=>cfg.url&&cfg.key;
async function upsert(table,rows,conflict){

  try{
    for(let i=0;i<rows.length;i+=500)
      await sb('POST',`${table}?on_conflict=${conflict}`,rows.slice(i,i+500),{Prefer:'resolution=merge-duplicates,return=minimal'});
    status('บันทึกขึ้น Supabase แล้ว');
  }catch(e){status('Supabase error: '+e.message,1)}
}
async function getAll(table){

    const r=await fetch(`${cfg.url.replace(/\/$/,'')}/rest/v1/${table}?select=*`,{headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,Range:`${from}-${from+999}`}});
    if(!r.ok) throw new Error(await r.text());
    const j=await r.json(); out=out.concat(j); if(j.length<1000) break; from+=1000;
  }
  return out;
}

}
function span(rows,i,keys){
  const k=r=>keys.map(x=>r[x]).join('|');
  if(i>0&&k(rows[i-1])===k(rows[i])) return 0;
  let n=1; while(i+n<rows.length&&k(rows[i+n])===k(rows[i])) n++; return n;

    if((ac==='1'||ac==='0')&&((aa>0?'1':'0')!==ac)) return;
    if(pl!==''&&((num(d.work_plan)||0)>0?'1':'0')!==pl) return;
    if(jb!==''&&((num(d.jobs_closed)||0)>0?'1':'0')!==jb) return; n++;
    const f=(k,cl,ty)=>ty==='text'?`<td class="x"><textarea rows="1" placeholder="พิมพ์สาเหตุ..." data-t="${esc(t.team_id)}" data-k="${k}">${esc(d[k])}</textarea></td>`:`<td${ty?'':' class="n"'}><input ${cl?'class="t"':''} type="${ty||'number'}" ${ty?'':'min="0"'} data-t="${esc(t.team_id)}" data-k="${k}" value="${esc(d[k])}"></td>`;
    h+=`<tr><td class="l">${esc(clOf(t.province))}</td><td>${esc(t.province)}</td><td>${esc(t.skill)}</td><td class="tm" title="${esc(t.team_name||t.team_id)}">${esc(t.team_name||t.team_id)}</td>${f('team_active')}${f('work_plan')}${f('work_actual')}${f('absent_reason',1,'text')}${f('jobs_closed')}${f('not_closed_reason',1,'text')}</tr>`;
  });
  $('detTbl').innerHTML=h+`</tbody></table><div style="color:var(--mut);margin-top:6px">${n} ทีม · แก้ไขแล้วบันทึกอัตโนมัติ</div>`;
}

});

// ---------- Excel import ----------
function toISO(v){
  if(v instanceof Date) return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const m=String(v).trim().match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null;
}
const readWB=f=>f.arrayBuffer().then(b=>XLSX.read(b,{type:'array',cellDates:true}));
const grid=ws=>XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
async function logUpload(kind,file,ok,detail){
  if(!remote()) return;
  try{await sb('POST','upload_log',[{kind,file_name:file,ok,detail}],{Prefer:'return=minimal'})}catch(e){}
}

// --- Teams Online: รายชื่อทีม + Active/Plan/Actual ของวันที่เลือก ---
let pendingTeams=null;
async function importTeams(file,date){
  const wb=await readWB(file); let rows,h=-1;
  for(const n of wb.SheetNames){rows=grid(wb.Sheets[n]);h=rows.findIndex(r=>r&&r.includes('Team')&&r.includes('Province'));if(h>=0)break}
  if(h<0) return alert('ไม่พบหัวคอลัมน์ Province / Team ในไฟล์นี้');
  const need=['Province','Team','Team Total','Working Plan','Clock in'], miss=need.filter(c=>!rows[h].includes(c));
  if(miss.length){await logUpload('teams',file.name,false,{missing:miss});return alert('ไฟล์ Teams Online ขาดคอลัมน์: '+miss.join(', '))}
  const ix=n=>rows[h].indexOf(n);
  let pv=null,sp=null,sk=null;const found=new Set(),tOut=[],dOut=[];
  rows.slice(h+1).forEach(r=>{
    if(r[ix('Province')]){ if(String(r[ix('Province')]).trim()!==pv) sk=null; pv=String(r[ix('Province')]).trim() }
    if(r[ix('Supervisor')]) sp=String(r[ix('Supervisor')]).trim();
    if(r[ix('Skill')]) sk=String(r[ix('Skill')]).trim();
    const t=r[ix('Team')]; if(!t||pv==='Total') return;
    const name=String(t).trim(), id=tcode(name); found.add(id);
    const old=S.teams[id]||{};
    tOut.push(S.teams[id]={team_id:id,team_name:name,region:'EAS',province:pv,skill:sk||old.skill||(/-NOD-/.test(id)?'NODE':'OFC'),supervisor:sp,is_current:true});
    const k=key(date,id), d=S.daily[k]||(S.daily[k]={report_date:date,team_id:id});
    d.team_active=num(r[ix('Team Total')])??0; d.work_plan=num(r[ix('Working Plan')])??0; d.work_actual=num(r[ix('Clock in')])??0;
    dOut.push(d);
  });
  const gone=Object.values(S.teams).filter(t=>t.is_current!==false&&!found.has(t.team_id));
  gone.forEach(t=>{t.is_current=false;tOut.push(t)});
  await upsert('teams',tOut,'team_id'); await upsert('daily_follow',dOut,'report_date,team_id');
  await logUpload('teams',file.name,true,{date,teams:found.size,removed:gone.length});
  $('date').value=date; refresh();
  status(`อัปเดตรายชื่อทีม ${found.size} ทีม + Active/Plan/Actual วันที่ ${fmtD(date)}${gone.length?` · ถอดออก ${gone.length} ทีม`:''}`);
}

// --- CM Work Order List: นับ "งานที่ปิดได้" + Pipeline Recheck Column ---
//<WO>
const WO_COLS=['Work Order ID','Source Ticket ID','SDM TT','External Ticket ID','Region','Province','Skill','Team','Site ID','Status','Suspend Status','Incident Urgency','Severity','WO Creator','Created Time','Require Finish Time','SLA','Dispatched','Accepted','Departed','Arrived','Completed','Closed','Time to Arrive','Time to Complete','Time to Leave','Work Type','Fault Size','Point','Root Cause','Sub Root Cause','Close Description','Complete Solution','Subject'];
const woCreatorOK=c=>{c=String(c??'').trim().toLowerCase();return c==='system'||c.includes('inoc')};
function woDate(v){
  if(v instanceof Date&&!isNaN(v)) return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const s=String(v??'').trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/); return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null;
}
// rows = array of arrays (แถวแรก = หัวคอลัมน์), codeToId = {รหัสทีม: team_id}
function processWO(rows,codeToId){
  const steps=[],add=(n,st,msg)=>{steps.push({n,st,msg});return st!=='fail'};
  const res={steps,ok:false,counts:{},total:0,unmatched:{}};
  if(!rows||!rows.length) {add('1. อ่านไฟล์','fail','ไม่พบข้อมูลในชีต');return res}
  const head=rows[0].map(x=>String(x??'').trim()), data=rows.slice(1).filter(r=>r.some(c=>c!==null&&c!==''));
  add('1. อ่านไฟล์','ok',`พบ ${data.length} แถว · ${head.filter(Boolean).length} คอลัมน์`);
  const miss=WO_COLS.filter(c=>!head.includes(c)), extra=head.filter(c=>c&&!WO_COLS.includes(c));
  if(miss.length){add('2. ตรวจ Column (Recheck)','fail',`ขาด ${miss.length} คอลัมน์: ${miss.join(', ')}`);return res}
  add('2. ตรวจ Column (Recheck)','ok',`ครบ ${WO_COLS.length}/${WO_COLS.length} คอลัมน์`+(extra.length?` · มีคอลัมน์เพิ่ม: ${extra.join(', ')}`:''));
  const I=n=>head.indexOf(n), iSt=I('Status'),iCr=I('WO Creator'),iTm=I('Team'),iCl=I('Closed'),iId=I('Work Order ID');
  const seen=new Set(); let dup=0;
  const uniq=data.filter(r=>{const k=r[iId]; if(k===null||k==='') return true; if(seen.has(k)){dup++;return false} seen.add(k);return true});
  add('3. ตรวจ Work Order ID ซ้ำ',dup?'warn':'ok',dup?`ซ้ำ ${dup} แถว (นับครั้งเดียว)`:'ไม่มี WO ซ้ำ');
  const closed=uniq.filter(r=>String(r[iSt]??'').trim().toLowerCase()==='closed');
  add('4. กรอง Status = Closed','ok',`${closed.length} จาก ${uniq.length} แถว`);
  const byCr=closed.filter(r=>woCreatorOK(r[iCr]));
  add('5. กรอง WO Creator = System หรือ INOC','ok',`${byCr.length} จาก ${closed.length} แถว (ตัดออก ${closed.length-byCr.length})`);
  const badDate=byCr.filter(r=>!woDate(r[iCl])).length, good=byCr.filter(r=>woDate(r[iCl]));
  if(!add('6. ตรวจวันที่ Closed',badDate?(good.length?'warn':'fail'):'ok',badDate?`อ่านวันที่ไม่ได้ ${badDate} แถว`:`อ่านวันที่ได้ทุกแถว`)) return res;
  let miss2=0;
  good.forEach(r=>{
    const code=tcode(r[iTm]), id=codeToId[code], d=woDate(r[iCl]);
    if(!id){miss2++;res.unmatched[code||'(ว่าง)']=(res.unmatched[code||'(ว่าง)']||0)+1;return}
    ((res.counts[d]=res.counts[d]||{})[id]=(res.counts[d][id]||0)+1); res.total++;
  });
  const um=Object.entries(res.unmatched).map(([k,v])=>`${k} (${v})`).join(', ');
  add('7. จับคู่ Team กับรายชื่อทีม',miss2?'warn':'ok',miss2?`ไม่พบทีม ${Object.keys(res.unmatched).length} ทีม / ${miss2} งาน: ${um}`:`จับคู่ได้ทุกทีม (${Object.values(res.counts).reduce((a,c)=>a+Object.keys(c).length,0)} ทีม-วัน)`);
  res.ok=true; return res;
}
//</WO>
async function importWO(file){
  const wb=await readWB(file); let rows=null,names=wb.SheetNames;
  for(const n of names){const g=grid(wb.Sheets[n]); if(g.length&&g[0]&&g[0].map(x=>String(x??'').trim()).includes('Work Order ID')){rows=g;break}}
  const codeToId={}; Object.values(S.teams).forEach(t=>{if(t.is_current!==false) codeToId[tcode(t.team_id)]=t.team_id});
  const res=rows?processWO(rows,codeToId):{steps:[{n:'1. อ่านไฟล์',st:'fail',msg:`ไม่พบชีตที่มีคอลัมน์ Work Order ID (ชีตในไฟล์: ${names.join(', ')})`}],ok:false,counts:{},total:0};
  if(res.ok){
    const out=[];
    Object.entries(res.counts).forEach(([d,m])=>{
      Object.values(S.teams).filter(t=>t.is_current!==false).forEach(t=>{       // เขียนทับทั้งวัน: ทีมที่ไม่มีงาน = 0
        const k=key(d,t.team_id),o=S.daily[k]||(S.daily[k]={report_date:d,team_id:t.team_id});
        o.jobs_closed=m[t.team_id]||0; out.push(o);
      });
    });
    await upsert('daily_follow',out,'report_date,team_id');
    // Recheck หลังบันทึก: ผลรวมที่เก็บต้องเท่ากับที่นับได้
    const saved=Object.keys(res.counts).reduce((a,d)=>a+Object.values(S.teams).reduce((b,t)=>b+((S.daily[key(d,t.team_id)]||{}).jobs_closed||0),0),0);
    res.steps.push({n:'8. บันทึก + Recheck ยอด',st:saved===res.total?'ok':'fail',msg:`วันที่ ${Object.keys(res.counts).sort().map(fmtD).join(', ')} · นับได้ ${res.total} งาน · ในระบบ ${saved} งาน`});
    const last=Object.keys(res.counts).sort().pop(); if(last) $('date').value=last;
    refresh();
  }
  await logUpload('wo',file.name,res.ok,{steps:res.steps,total:res.total});
  $('wSteps').innerHTML=res.steps.map(s=>`<div class="stp ${s.st}"><b>${s.st==='ok'?'✓':s.st==='warn'?'!':'✗'}</b><div>${esc(s.n)}<small>${esc(s.msg)}</small></div></div>`).join('')
    +`<div style="margin-top:10px;font-weight:700;color:var(${res.ok&&!res.steps.some(s=>s.st==='fail')?'--ok':'--bad'})">${res.ok&&!res.steps.some(s=>s.st==='fail')?'Pipeline สำเร็จ':'Pipeline ไม่สำเร็จ — ไม่มีข้อมูลถูกบันทึก'}</div>`;
  $('dW').showModal();
}
